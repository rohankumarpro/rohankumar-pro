[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["index.html", "netlify/lib/**"]

# Friendly address for the functions: /api/auth, /api/notes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Journal pages and sitemap, rendered on the server for search engines and AI crawlers
[[redirects]]
  from = "/journal"
  to = "/.netlify/functions/journal-page"
  status = 200
  force = true
[[redirects]]
  from = "/journal/*"
  to = "/.netlify/functions/journal-page?slug=:splat"
  status = 200
  force = true
[[redirects]]
  from = "/about"
  to = "/.netlify/functions/profile-page?page=about"
  status = 200
  force = true
[[redirects]]
  from = "/resume"
  to = "/.netlify/functions/profile-page?page=resume"
  status = 200
  force = true
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Keep server code and config out of the public site
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
