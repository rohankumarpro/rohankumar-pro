<style>
/* A popup over a blurred page: "Unlock link", email, newsletter box, one button. The real content only arrives after sign-up. */
:root{
  --bg:#E9EEF8; --surface:#FAFBFF; --surface2:#E8EDF6; --line:#D3DAE8; --ink:#1A1C20; --ink2:#454A55; --primary:#0B57D0; --on-primary:#fff;
  --shadow:0 12px 40px rgba(20,35,80,.18), 0 2px 6px rgba(20,35,80,.10);
  --font:"Google Sans Flex","Google Sans","Product Sans",Figtree,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1117; --surface:#1C1F26; --surface2:#292D36; --line:#3A3F4A; --ink:#E4E6EE; --ink2:#C2C6D2; --primary:#A8C7FA; --on-primary:#062E6F;
  --shadow:0 18px 50px rgba(0,0,0,.55); color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--surface);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5}
.page{max-width:520px;margin:0 auto;padding:calc(40 * var(--u)) calc(20 * var(--u)) calc(56 * var(--u))}
/* the stand-in behind the popup: grey bars shaped like the page, blurred */
.ghost{filter:blur(6px);opacity:.7;pointer-events:none;user-select:none}
.bar{height:16px;border-radius:var(--r-pill);background:var(--surface2);margin:0 0 calc(14 * var(--u))}
.bar.h{height:34px;width:85%}.bar.b{height:48px;width:55%;background:var(--primary);opacity:.5;margin:calc(28 * var(--u)) 0}
.unlocked .ghost,.unlocked .veil{display:none}
.veil{position:fixed;inset:0;display:grid;place-items:center;padding:calc(20 * var(--u));background:color-mix(in srgb,var(--bg) 45%,transparent);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pop{width:100%;max-width:380px;background:var(--surface);border-radius:var(--r-8);box-shadow:var(--shadow);padding:calc(28 * var(--u)) calc(24 * var(--u)) calc(24 * var(--u))}
.pop .brand{height:22px;width:auto;display:block;margin:0 0 calc(16 * var(--u))}
h1{font-size:var(--fs-10);line-height:1.2;font-weight:var(--fw-b);margin:0 0 calc(18 * var(--u));letter-spacing:-.01em}
input[type=email]{width:100%;font:inherit;font-size:var(--fs-6);color:var(--ink);background:var(--surface2);border:2px solid transparent;border-radius:var(--r-4);padding:calc(13 * var(--u)) calc(14 * var(--u));outline:none}
input[type=email]:focus{border-color:var(--primary)}
.opt{display:flex;gap:calc(10 * var(--u));align-items:center;margin:calc(14 * var(--u)) 0 calc(18 * var(--u));cursor:pointer;font-size:var(--fs-4);color:var(--ink2)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:22px;height:22px;border-radius:var(--r-2);border:2px solid var(--ink2);display:grid;place-items:center;color:transparent}
.opt input:checked + .box{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.opt input:focus-visible + .box{outline:2px solid var(--primary);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:calc(8 * var(--u));font:inherit;font-size:var(--fs-6);font-weight:var(--fw-m);border:0;border-radius:var(--r-pill);padding:calc(13 * var(--u)) calc(24 * var(--u));background:var(--primary);color:var(--on-primary);cursor:pointer;text-decoration:none}
.pop .btn{width:100%}
.btn[disabled]{opacity:.6;cursor:default}
.err{color:var(--danger);font-size:var(--fs-4);margin:calc(10 * var(--u)) 0 0}
.err:empty{display:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
/* after sign-up */
#got{display:none}.unlocked #got{display:block}
.block + .block{margin-top:calc(40 * var(--u));padding-top:calc(32 * var(--u));border-top:1px solid var(--line)}
.label{font-size:var(--fs-3);font-weight:var(--fw-b);text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:0 0 calc(6 * var(--u))}
#got h2{font-size:var(--fs-10);line-height:1.2;margin:0 0 calc(4 * var(--u))}
#got .host{color:var(--ink2);margin:0 0 calc(20 * var(--u))}
#got h3{font-size:var(--fs-6);margin:calc(28 * var(--u)) 0 calc(10 * var(--u))}
ol{margin:0;padding-left:calc(22 * var(--u));display:grid;gap:calc(8 * var(--u))}
ol li{min-width:0}
.cmd{position:relative;margin-top:calc(8 * var(--u))}
.cmd pre{margin:0;background:var(--surface2);border-radius:var(--r-4);padding:calc(12 * var(--u)) calc(14 * var(--u)) calc(40 * var(--u));white-space:pre-wrap;word-break:break-word;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:var(--fs-2);line-height:1.6}
.copy{position:absolute;right:calc(8 * var(--u));bottom:calc(8 * var(--u));border:0;border-radius:var(--r-pill);padding:calc(4 * var(--u)) calc(12 * var(--u));background:var(--surface);color:var(--ink);font:inherit;font-size:var(--fs-2);font-weight:var(--fw-m);cursor:pointer}
.tip{color:var(--ink2);font-size:var(--fs-4);margin:calc(16 * var(--u)) 0 0}
</style>
</head>
<body>
<main id="app" data-list="sound">
  <div class="page ghost" aria-hidden="true">
    <div class="bar" style="width:30%"></div><div class="bar h"></div><div class="bar h" style="width:60%"></div>
    <div class="bar b"></div><div class="bar"></div><div class="bar" style="width:90%"></div><div class="bar" style="width:75%"></div><div class="bar" style="width:85%"></div><div class="bar" style="width:60%"></div>
  </div>

  <div class="veil">
    <form class="pop" id="f" novalidate>
      <picture><source srcset="/img/sansser/logo-dark.png" media="(prefers-color-scheme: dark)"><img class="brand" src="/img/sansser/logo.png" alt="Sansser" width="42" height="22"></picture>
      <h1>Unlock links</h1>
      <input id="em" type="email" name="email" autocomplete="email" inputmode="email" placeholder="Your email" aria-label="Your email" required>
      <div class="hp" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>
      <label class="opt"><input type="checkbox" id="news"><span class="box" id="tick"></span><span>Subscribe to the newsletter</span></label>
      <button class="btn" id="go" type="submit">Unlock</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </div>

  <section class="page" id="got" aria-live="polite"></section>
</main>
<!-- bump ?v= whenever lead-offer.mjs changes: the service worker serves cached scripts first -->
<script type="module" src="/js/lead-offer.mjs?v=2"></script>
</body>
</html>
