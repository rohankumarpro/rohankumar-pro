# Builds the owner's personal desktop app (desktop/) as a Windows installer.
# Runs on GitHub, not Netlify: it never deploys the site and uses no Netlify build credits.
# Only runs when something in desktop/ changes. The installer is attached to the run as "Rohan-Kumar-Windows".
name: Desktop app

on:
  push:
    branches: [dev, main]
    paths: ["desktop/**", ".github/workflows/desktop-app.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Rohan-Kumar-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
